<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="theme-color" content="#1a1224" />
		<meta name="robots" content="noindex,nofollow" />
		<title>Смелая мышь</title>
		<meta name="description" content="«В пустом амбаре мышь жила…» — стихотворная сказка." />
		<meta property="og:title" content="Смелая мышь" />
		<meta property="og:type" content="book" />
		<meta property="og:image" content="./pages/00.png" />
		<link rel="icon" href="./pages/00.png" />
		<link rel="stylesheet" href="../reader.css" />
		<link rel="preload" href="./pages/00.png" as="image" />
		<link rel="preload" href="./pages/01.png" as="image" />
		<link rel="preload" href="./pages/02.png" as="image" />
	</head>
	<body>
		<header class="topbar">
			<a href="../" class="brand">Смелая мышь</a>
			<div class="brand__sub">в пустом амбаре мышь жила</div>
		</header>

		<main class="stage" id="stage">
			<div class="loader" id="loader" aria-live="polite">
				<div class="loader__spinner" aria-hidden="true"></div>
				<div class="loader__text">Готовим книжку…</div>
			</div>
			<div class="book-wrap" id="bookWrap" hidden>
				<button class="nav nav--prev" id="prevBtn" type="button" aria-label="Назад">
					<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
				</button>
				<div class="book" id="book"></div>
				<button class="nav nav--next" id="nextBtn" type="button" aria-label="Вперёд">
					<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
				</button>
			</div>
		</main>

		<footer class="bottombar" id="bottombar" hidden>
			<button class="btn-icon" id="firstBtn" type="button" aria-label="К началу"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
			<div class="progress" aria-label="Прогресс">
				<input type="range" id="progressRange" min="0" max="0" step="1" value="0" aria-label="Перейти к странице"/>
				<div class="progress__label"><span id="pageLabel">—</span></div>
			</div>
			<button class="btn-icon" id="lastBtn" type="button" aria-label="К концу"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
			<button class="btn-icon" id="fullscreenBtn" type="button" aria-label="Полный экран"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
		</footer>

		<script>
			window.BOOK = {
				totalPages: 14,
				pageW: 724,
				pageH: 1086,
				pagesPath: './pages',
				hardCovers: [0, 13],
			};
		</script>
		<script src="../pageflip.js"></script>
		<script src="../reader.js"></script>
	</body>
</html>
