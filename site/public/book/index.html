		<title>Книжная полка</title>

				<a class="library-card" href="./smelaya-mysh/">
					<div class="library-card__cover" style="background-image:url('./smelaya-mysh/pages/00.png')"></div>

					<div class="library-card__sub">в пустом амбаре мышь жила</div>
